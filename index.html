<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الألعاب التفاعلية | Roblox Style Hub</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #111216;
      --bg-card: #191b20;
      --bg-input: #23252b;
      --primary: #00a2ff;
      --primary-hover: #0082cc;
      --text-main: #ffffff;
      --text-sub: #9ea3b0;
      --accent-green: #00e676;
      --accent-red: #ff3d00;
      --border-color: #2a2d35;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 70px;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: rgba(17, 18, 22, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .avatar-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #333;
      object-fit: cover;
      border: 2px solid var(--primary);
    }

    .user-info h3 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .user-info p {
      font-size: 11px;
      color: var(--text-sub);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg-input);
    }

    .robux-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      font-size: 13px;
    }

    /* Sections */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      padding: 16px 16px 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .action-text-btn {
      color: var(--primary);
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    /* Horizontal Friends Scroll */
    .friends-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 8px 16px;
      scrollbar-width: none;
    }
    .friends-scroll::-webkit-scrollbar { display: none; }

    .friend-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 65px;
      cursor: pointer;
    }

    .friend-avatar-wrap {
      position: relative;
      width: 55px;
      height: 55px;
      margin-bottom: 6px;
    }

    .friend-avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #2a2d35;
    }

    .status-dot {
      position: absolute;
      bottom: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--bg-dark);
    }
    .status-online { background-color: var(--accent-green); }
    .status-offline { background-color: var(--text-sub); }

    .friend-name {
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65px;
    }

    .add-friend-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 2px dashed var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 20px;
      cursor: pointer;
      background: var(--bg-card);
    }

    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 8px 16px;
    }

    .game-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
    }

    .game-thumb {
      width: 100%;
      height: 110px;
      object-fit: cover;
      background: #23252b;
    }

    .game-details {
      padding: 10px;
    }

    .game-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-desc {
      font-size: 11px;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 28px;
    }

    .game-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-sub);
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: rgba(25, 27, 32, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-sub);
      font-size: 11px;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item i {
      font-size: 18px;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .modal-header h3 {
      font-size: 16px;
    }

    .close-btn {
      cursor: pointer;
      color: var(--text-sub);
      font-size: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      color: var(--text-sub);
    }

    .input-group input, .input-group textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .empty-state {
      padding: 30px 16px;
      text-align: center;
      color: var(--text-sub);
      font-size: 13px;
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="user-badge" onclick="openProfileModal()">
        <img id="headerAvatar" class="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=Yusef" alt="Profile">
        <div class="user-info">
          <h3 id="headerUsername">المستخدم <i class="fas fa-certificate" style="color: var(--primary); font-size: 11px;"></i></h3>
          <p id="headerTag">@User_123</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="robux-btn">
          <i class="fas fa-cube" style="color: var(--accent-green);"></i>
          <span>1,250</span>
        </div>
        <div class="icon-btn" onclick="openAddGameModal()">
          <i class="fas fa-plus"></i>
        </div>
      </div>
    </header>

    <!-- Friends Section -->
    <div class="section-title">
      <span>الأصدقاء (<span id="friendsCount">0</span>)</span>
      <span class="action-text-btn" onclick="openAddFriendModal()">+ إضافة صديق</span>
    </div>

    <div class="friends-scroll" id="friendsList">
      <div class="friend-card" onclick="openAddFriendModal()">
        <div class="add-friend-btn">
          <i class="fas fa-user-plus"></i>
        </div>
        <span class="friend-name">إضافة</span>
      </div>
    </div>

    <!-- Games Section -->
    <div class="section-title">
      <span>المابات والألعاب</span>
      <span class="action-text-btn" onclick="openAddGameModal()">+ إنشاء ماب</span>
    </div>

    <div class="games-grid" id="gamesGrid">
      <!-- Dynamic Games Will Be Inserted Here -->
    </div>

    <!-- Bottom Nav Bar -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <i class="fas fa-home"></i>
        <span>الرئيسية</span>
      </div>
      <div class="nav-item" onclick="openAddGameModal()">
        <i class="fas fa-plus-circle"></i>
        <span>إنشاء</span>
      </div>
      <div class="nav-item" onclick="openProfileModal()">
        <i class="fas fa-user"></i>
        <span>حسابي</span>
      </div>
    </div>
  </div>

  <!-- Modal: Create Game -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>إنشاء ماب جديد</h3>
        <i class="fas fa-times close-btn" onclick="closeModal('gameModal')"></i>
      </div>
      <div class="input-group">
        <label>اسم الماب</label>
        <input type="text" id="gameTitle" placeholder="مثال: عالم المغامرات">
      </div>
      <div class="input-group">
        <label>وصف الماب</label>
        <textarea id="gameDesc" rows="3" placeholder="اكتب وصفاً قصيراً للعبة..."></textarea>
      </div>
      <div class="input-group">
        <label>رابط صورة الغلاف (اختياري)</label>
        <input type="text" id="gameImage" placeholder="https://...">
      </div>
      <button class="btn-submit" onclick="saveGame()">نشر الماب</button>
    </div>
  </div>

  <!-- Modal: Add Friend -->
  <div class="modal" id="friendModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>إضافة صديق جديد</h3>
        <i class="fas fa-times close-btn" onclick="closeModal('friendModal')"></i>
      </div>
      <div class="input-group">
        <label>اسم الصديق</label>
        <input type="text" id="friendName" placeholder="مثال: أحمد">
      </div>
      <button class="btn-submit" onclick="saveFriend()">إضافة الصديق</button>
    </div>
  </div>

  <!-- Modal: Edit Profile -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>تعديل البروفايل</h3>
        <i class="fas fa-times close-btn" onclick="closeModal('profileModal')"></i>
      </div>
      <div class="input-group">
        <label>اسم المستخدم</label>
        <input type="text" id="profileNameInput">
      </div>
      <div class="input-group">
        <label>المعرف (@)</label>
        <input type="text" id="profileTagInput">
      </div>
      <button class="btn-submit" onclick="saveProfile()">حفظ التغيرات</button>
    </div>
  </div>

  <script>
    // State Data
    let userData = JSON.parse(localStorage.getItem('roblox_user')) || {
      name: 'Yusef',
      tag: '@Yusef_Dev',
      avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Yusef'
    };

    let friends = JSON.parse(localStorage.getItem('roblox_friends')) || [];
    let games = JSON.parse(localStorage.getItem('roblox_games')) || [];

    // Initialize UI
    function init() {
      updateProfileUI();
      renderFriends();
      renderGames();
    }

    function updateProfileUI() {
      document.getElementById('headerUsername').childNodes[0].nodeValue = userData.name + ' ';
      document.getElementById('headerTag').innerText = userData.tag;
      document.getElementById('headerAvatar').src = userData.avatar;
    }

    function renderFriends() {
      const friendsList = document.getElementById('friendsList');
      document.getElementById('friendsCount').innerText = friends.length;

      let html = `
        <div class="friend-card" onclick="openAddFriendModal()">
          <div class="add-friend-btn">
            <i class="fas fa-user-plus"></i>
          </div>
          <span class="friend-name">إضافة</span>
        </div>
      `;

      friends.forEach((friend, index) => {
        html += `
          <div class="friend-card" onclick="deleteFriend(${index})">
            <div class="friend-avatar-wrap">
              <img src="${friend.avatar}" alt="${friend.name}">
              <div class="status-dot ${friend.online ? 'status-online' : 'status-offline'}"></div>
            </div>
            <span class="friend-name">${friend.name}</span>
          </div>
        `;
      });

      friendsList.innerHTML = html;
    }

    function renderGames() {
      const gamesGrid = document.getElementById('gamesGrid');

      if (games.length === 0) {
        gamesGrid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-gamepad" style="font-size: 32px; margin-bottom: 10px; display: block;"></i>
            لا يوجد مابات حالياً. اضغط على "+ إنشاء ماب" لإضافة أول ماب لك!
          </div>
        `;
        return;
      }

      let html = '';
      games.forEach((game, index) => {
        const defaultImg = `https://picsum.photos/seed/${index + 10}/300/200`;
        html += `
          <div class="game-card">
            <img class="game-thumb" src="${game.image || defaultImg}" alt="${game.title}">
            <div class="game-details">
              <div class="game-title">${game.title}</div>
              <div class="game-desc">${game.desc || 'لا يوجد وصف متاح.'}</div>
              <div class="game-meta">
                <span><i class="fas fa-user"></i> ${game.players || 0}</span>
                <i class="fas fa-trash-alt" style="color: var(--accent-red); cursor: pointer;" onclick="deleteGame(${index})"></i>
              </div>
            </div>
          </div>
        `;
      });

      gamesGrid.innerHTML = html;
    }

    // Modal Handlers
    function openAddGameModal() { document.getElementById('gameModal').classList.add('active'); }
    function openAddFriendModal() { document.getElementById('friendModal').classList.add('active'); }
    function openProfileModal() {
      document.getElementById('profileNameInput').value = userData.name;
      document.getElementById('profileTagInput').value = userData.tag;
      document.getElementById('profileModal').classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // Save Functions
    function saveGame() {
      const title = document.getElementById('gameTitle').value.trim();
      const desc = document.getElementById('gameDesc').value.trim();
      const image = document.getElementById('gameImage').value.trim();

      if (!title) return alert('يرجى كتابة اسم الماب');

      games.unshift({
        title: title,
        desc: desc,
        image: image,
        players: Math.floor(Math.random() * 50) + 1
      });

      localStorage.setItem('roblox_games', JSON.stringify(games));
      renderGames();
      closeModal('gameModal');

      document.getElementById('gameTitle').value = '';
      document.getElementById('gameDesc').value = '';
      document.getElementById('gameImage').value = '';
    }

    function saveFriend() {
      const name = document.getElementById('friendName').value.trim();
      if (!name) return alert('يرجى كتابة اسم الصديق');

      friends.unshift({
        name: name,
        avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`,
        online: Math.random() > 0.3
      });

      localStorage.setItem('roblox_friends', JSON.stringify(friends));
      renderFriends();
      closeModal('friendModal');
      document.getElementById('friendName').value = '';
    }

    function saveProfile() {
      const name = document.getElementById('profileNameInput').value.trim();
      const tag = document.getElementById('profileTagInput').value.trim();

      if (name) userData.name = name;
      if (tag) userData.tag = tag;
      userData.avatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`;

      localStorage.setItem('roblox_user', JSON.stringify(userData));
      updateProfileUI();
      closeModal('profileModal');
    }

    function deleteGame(index) {
      if (confirm('هل أنت تأكد من حذف هذا الماب؟')) {
        games.splice(index, 1);
        localStorage.setItem('roblox_games', JSON.stringify(games));
        renderGames();
      }
    }

    function deleteFriend(index) {
      if (confirm('هل تريد إزالة هذا الصديق؟')) {
        friends.splice(index, 1);
        localStorage.setItem('roblox_friends', JSON.stringify(friends));
        renderFriends();
      }
    }

    // Start App
    init();
  </script>
</body>
</html>
